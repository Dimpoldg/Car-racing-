<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Racing Ultra</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#game{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* 3D ROAD */
.road{
  position:absolute;
  width:100%;
  height:200%;
  background:linear-gradient(#222,#000);
  transform:perspective(400px) rotateX(60deg);
}

.line{
  position:absolute;
  width:10px;
  height:100px;
  background:white;
  left:50%;
  animation:move 0.5s linear infinite;
}

@keyframes move{
  from{top:-100px;}
  to{top:100vh;}
}

/* CAR */
.car{
  position:absolute;
  width:60px;
  bottom:30px;
  left:45%;
}

/* ENEMY */
.enemy{
  position:absolute;
  width:60px;
  top:-100px;
}

/* RAIN */
.rain{
  position:absolute;
  width:2px;
  height:20px;
  background:rgba(255,255,255,0.5);
  animation:rain 0.3s linear infinite;
}

@keyframes rain{
  from{top:-20px;}
  to{top:100vh;}
}

/* UI */
#ui{
  position:absolute;
  top:10px;
  width:100%;
  color:white;
  text-align:center;
}

#wheel{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border:5px solid white;
  border-radius:50%;
}

</style>
</head>

<body>

<div id="game">
  <div class="road"></div>

  <!-- ROAD LINES -->
  <div class="line"></div>

  <!-- PLAYER -->
  <img id="player" class="car"
  src="https://cdn-icons-png.flaticon.com/512/743/743922.png">

  <div id="ui">
    <h2>Score: <span id="score">0</span></h2>
    <button onclick="startGame()">Start</button>
    <button onclick="toggleMode()">Day/Night</button>
  </div>

  <div id="wheel"></div>
</div>

<script>
let player=document.getElementById("player");
let game=document.getElementById("game");

let x=window.innerWidth/2;
let score=0;
let speed=4;
let running=false;
let night=false;

// SOUND
let engine=new Audio("https://www.soundjay.com/transportation/car-engine-1.mp3");
engine.loop=true;

let crash=new Audio("https://www.soundjay.com/button/beep-07.wav");

function startGame(){
  running=true;
  score=0;
  engine.play();
  loop();
  spawnEnemy();
  rainEffect();
}

function loop(){
  if(!running) return;

  player.style.left=x+"px";
  score++;

  document.getElementById("score").innerText=score;

  requestAnimationFrame(loop);
}

// STEERING WHEEL CONTROL
let wheel=document.getElementById("wheel");

wheel.addEventListener("touchmove",e=>{
  let touch=e.touches[0].clientX;
  x=touch-30;
});

// ENEMY
function spawnEnemy(){
  if(!running) return;

  let e=document.createElement("img");
  e.src="https://cdn-icons-png.flaticon.com/512/743/743131.png";
  e.classList.add("enemy");
  e.style.left=Math.random()*(window.innerWidth-60)+"px";
  game.appendChild(e);

  let y=-100;

  function move(){
    if(!running) return;

    y+=speed*5;
    e.style.top=y+"px";

    let p=player.getBoundingClientRect();
    let er=e.getBoundingClientRect();

    if(p.left<er.right && p.right>er.left && p.top<er.bottom && p.bottom>er.top){
      crash.play();
      running=false;
      engine.pause();
      alert("💥 Crash! Score: "+score);
      location.reload();
    }

    if(y<window.innerHeight){
      requestAnimationFrame(move);
    } else {
      e.remove();
    }
  }

  move();
  setTimeout(spawnEnemy,1000);
}

// DAY NIGHT
function toggleMode(){
  night=!night;
  document.body.style.background = night ? "#000" : "#87CEEB";
}

// RAIN
function rainEffect(){
  setInterval(()=>{
    let r=document.createElement("div");
    r.classList.add("rain");
    r.style.left=Math.random()*window.innerWidth+"px";
    game.appendChild(r);

    setTimeout(()=>r.remove(),300);
  },50);
}
</script>

</body>
</html>
