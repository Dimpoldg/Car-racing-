<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra Racing Fixed</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#game{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* ROAD */
.road{
  position:absolute;
  width:100%;
  height:200%;
  background:linear-gradient(#222,#000);
}

.line{
  position:absolute;
  width:6px;
  height:100px;
  background:white;
  left:50%;
  animation:move 0.4s linear infinite;
}

@keyframes move{
  from{top:-100px;}
  to{top:100vh;}
}

/* PLAYER */
.car{
  position:absolute;
  width:60px;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
}

/* ENEMY */
.enemy{
  position:absolute;
  width:60px;
  top:-100px;
}

/* UI */
#ui{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  color:white;
}

/* STEERING */
#wheel{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:120px;
  border:3px solid white;
  border-radius:50%;
}

</style>
</head>

<body>

<div id="game">
  <div class="road"></div>
  <div class="line"></div>

  <img id="player" class="car"
  src="https://cdn-icons-png.flaticon.com/512/2972/2972185.png">

  <div id="ui">
    <h2>Score: <span id="score">0</span></h2>
    <button onclick="startGame()">Start</button>
  </div>

  <div id="wheel"></div>
</div>

<script>
let player=document.getElementById("player");
let game=document.getElementById("game");

let x=window.innerWidth/2 - 30;
let score=0;
let speed=5;
let running=false;

function startGame(){
  running=true;
  score=0;
  loop();
  spawnEnemy();
}

function loop(){
  if(!running) return;

  player.style.left=x+"px";
  score++;

  document.getElementById("score").innerText=score;

  requestAnimationFrame(loop);
}

// STEERING CONTROL (smooth)
let wheel=document.getElementById("wheel");

wheel.addEventListener("touchmove",e=>{
  let touch=e.touches[0].clientX;
  x=touch-30;
});

// ENEMY SPAWN FIXED
function spawnEnemy(){
  if(!running) return;

  let e=document.createElement("img");
  e.src="https://cdn-icons-png.flaticon.com/512/743/743131.png";
  e.classList.add("enemy");

  let lane=[window.innerWidth*0.3, window.innerWidth*0.5, window.innerWidth*0.7];
  e.style.left=lane[Math.floor(Math.random()*3)]+"px";

  game.appendChild(e);

  let y=-100;

  function move(){
    if(!running) return;

    y+=speed*5;
    e.style.top=y+"px";

    let p=player.getBoundingClientRect();
    let er=e.getBoundingClientRect();

    if(p.left<er.right && p.right>er.left && p.top<er.bottom && p.bottom>er.top){
      running=false;
      alert("💥 Game Over\nScore: "+score);
      location.reload();
    }

    if(y<window.innerHeight){
      requestAnimationFrame(move);
    } else {
      e.remove();
    }
  }

  move();
  setTimeout(spawnEnemy,1200);
}
</script>

</body>
</html>
