<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Racing Game</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#111;
  font-family:sans-serif;
}

/* GAME AREA */
#game{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* ROAD */
.road{
  position:absolute;
  width:100%;
  height:100%;
  background:#2b2b2b;
}

/* ROAD LINES */
.line{
  position:absolute;
  width:6px;
  height:100px;
  background:white;
  left:50%;
  animation:road 0.3s linear infinite;
}

@keyframes road{
  from{top:-100px;}
  to{top:100vh;}
}

/* PLAYER CAR */
.car{
  position:absolute;
  width:90px;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  transition:0.1s;
  filter: drop-shadow(0 0 10px red);
}

/* ENEMY */
.enemy{
  position:absolute;
  width:80px;
  top:-100px;
}

/* UI */
#ui{
  position:absolute;
  top:15px;
  width:100%;
  text-align:center;
  color:white;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  font-weight:bold;
}

/* STEERING PAD */
#pad{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:80px;
  background:rgba(255,255,255,0.1);
  border-radius:40px;
}
</style>
</head>

<body>

<div id="game">
  <div class="road"></div>
  <div class="line"></div>

  <img id="player" class="car"
  src="https://i.ibb.co/SDwymY5r/1775007248476.png">

  <div id="ui">
    <h2>Score: <span id="score">0</span></h2>
    <button onclick="startGame()">START GAME</button>
  </div>

  <div id="pad"></div>
</div>

<script>
let player=document.getElementById("player");
let game=document.getElementById("game");

let x=window.innerWidth/2 - 45;
let score=0;
let speed=6;
let running=false;

function startGame(){
  running=true;
  score=0;
  loop();
  spawnEnemy();
}

function loop(){
  if(!running) return;

  player.style.left=x+"px";

  // tilt
  let angle=(x - window.innerWidth/2)/8;
  player.style.transform=`translateX(-50%) rotate(${angle}deg)`;

  score++;
  document.getElementById("score").innerText=score;

  requestAnimationFrame(loop);
}

/* CONTROL */
let pad=document.getElementById("pad");

pad.addEventListener("touchmove",e=>{
  let touch=e.touches[0].clientX;
  x += (touch - x - 45)*0.2;
});

/* ENEMY */
function spawnEnemy(){
  if(!running) return;

  let e=document.createElement("img");
  e.src="https://cdn-icons-png.flaticon.com/512/743/743131.png";
  e.classList.add("enemy");

  let lanes=[0.3,0.5,0.7];
  e.style.left=window.innerWidth*lanes[Math.floor(Math.random()*3)]+"px";

  game.appendChild(e);

  let y=-100;

  function move(){
    if(!running) return;

    y+=speed*6;
    e.style.top=y+"px";

    let p=player.getBoundingClientRect();
    let er=e.getBoundingClientRect();

    if(p.left<er.right && p.right>er.left && p.top<er.bottom && p.bottom>er.top){
      running=false;
      alert("💥 Game Over\nScore: "+score);
      location.reload();
    }

    if(y<window.innerHeight){
      requestAnimationFrame(move);
    } else {
      e.remove();
    }
  }

  move();
  setTimeout(spawnEnemy,900);
}
</script>

</body>
</html>
