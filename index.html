<!DOCTYPE html>

<head>

<title>GTA Style Car Game</title>
<link rel="stylesheet" href="style.css">

<style>

  margin: 0;
  overflow: hidden;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  z-index: 10;
}

  padding: 10px;
  margin: 5px;
